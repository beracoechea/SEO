name: Verificar antes de publicar

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Contrato
        run: node scripts/contract.mjs

      - name: Tests y build web
        working-directory: apps/web
        run: |
          npm ci
          npx vitest run
          npm run build

      - name: Tests runtime
        working-directory: apps/runtime
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: E2E login (Playwright)
        working-directory: apps/web
        env:
          VERIFY_E2E: "1"
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: docker compose config
        run: |
          cp apps/runtime/.env.example apps/runtime/.env
          docker compose -f docker-compose.yml config
