services:
  runtime:
    build: ./apps/runtime
    image: seo-runtime:0.1.0
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - ./apps/runtime/.env
    environment:
      DATA_DIR: /app/data
    volumes:
      - runtime-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  runtime-data:
